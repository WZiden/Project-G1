<!doctype html>
<html lang="sv">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Smart Home</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
        <link rel="stylesheet" href="style.css">
        <script src="login.js" defer></script>
    </head>
    <body>
        <div class="wrapper">
            <div id="modalContainer">

                <div class="verticalContainer modalContent" id="modalContentLogin">
                    <span class="closeModal">&times;</span>
                    <h1>Log in</h1>
                    <form id="loginForm">
                        <label for="loginemail">Email</label>
                        <div class="inputContainer">
                            <input type="email" placeholder="Enter your email" id="loginemail" name="email" autocomplete="on" required>
                            <span class="material-symbols-outlined">mail</span>
                        </div>
                        <label for="loginpassword">Password</label>
                        <div class="inputContainer">
                            <input type="password" placeholder="Enter your password" id="loginpassword" name="password" required>
                            <span class="material-symbols-outlined">lock</span>
                        </div>
                        <label>
                            <input type="checkbox" checked="checked" name="remember" class="check">Remember me
                        </label>
                        <button type="submit">Log in</button>
                        <div class="horizontalcontainer">
                            <a class="forgottenLink">Forgot your password?</a> 
                            <a class="registerLink">Register new account</a>                   
                        </div>
                    </form>
                </div>

                <div class="verticalContainer modalContent" id="modalContentForgotten">
                    <span class="closeModal">&times;</span>
                    <h1>Reset password</h1>
                    <form id="forgottenForm">
                        <label for="forgottenemail">Email</label>
                        <div class="inputContainer">
                            <input type="email" placeholder="Enter your email" id="forgottenemail" name="email" autocomplete="on" required>
                            <span class="material-symbols-outlined">mail</span>
                        </div>
                        <button type="submit">Send verification code</button>
                        <div class="horizontalcontainer">
                            <a class="loginLink">Login</a> 
                            <a class="registerLink">Register new account</a>                   
                        </div>
                    </form>
                </div>

                <div class="verticalContainer modalContent" id="modalContentRegister">
                    <span class="closeModal">&times;</span>
                    <h1>Register new account</h1>
                    <form id="registerForm">
                        <label for="registerusername">Username</label>
                        <div class="inputContainer">
                            <input type="text" placeholder="Enter your username" id="registerusername" name="username" autocomplete="on" required>
                            <span class="material-symbols-outlined">person</span>
                        </div>
                        <label for="registeremail">Email</label>
                        <div class="inputContainer">
                            <input type="email" placeholder="Enter your email" id="registeremail" name="email" autocomplete="on" required>
                            <span class="material-symbols-outlined">mail</span>
                        </div>
                        <label for="registerpassword">Password</label>
                        <div class="inputContainer">
                            <input type="password" placeholder="Enter your password" id="registerpassword" name="password" required>
                            <span class="material-symbols-outlined">lock</span>
                        </div>
                        <button type="submit">Register</button>
                        <div class="horizontalcontainer">
                            <a class="forgottenLink">Forgot your password?</a> 
                            <a class="loginLink">Login</a>                   
                        </div>
                    </form>
                </div>

            </div>
            
            <div class="container">
                <header class="grid-box">
                    <div class="logo">
                       <h1>Smart Home<h1>
                    </div>
                    <div class="header-button"> 
                        <button class = "room-btn" data-room ="Devices"> Devices</button>
                        <button class = "room-btn" data-room ="history" > History</button>
                        <button class = "room-btn" data-room ="profile" > Profile</button>
                        <button id="showLogin" class = "room-btn" data-room ="login" > Login</button>
                    </div> 
                </header>

                <nav class="scrollbar grid-box">
                    <div class ="button">
                        <form class="search">
                            <input type="search" placeholder="Search">
                            <button type="Search">Search</button>
                        </form>
                        <button class = "room-btn" data-room ="favorite" > Favorite</button>
                        <button class = "room-btn" data-room ="room1" > room1</button>
                        <button class = "room-btn" data-room ="room2" > room2</button>
                        <button class = "room-btn" data-room ="room3" > room3</button>
                        <button class = "room-btn" data-room ="room4" > room4</button>                    
                    </div>
                </nav>

                <main class="content-area grid-box">
                    <form class="search">
                        <input type="search" placeholder="Search">
                        <button type="Search">Search</button>
                    </form>
                    <div class= "cards">
                        <div class ="card">
                        <h2>Lamp1</h2>
                        <p> on</p>
                        <button class = "room-btn" > on/off</button>             
                        </div>
                        <div class ="card">
                        <h2>Lamp2</h2>
                        <p> on</p>
                        <button class = "room-btn" > on/off</button>             
                        </div>
                        <div class ="card">
                        <h2>Lamp3</h2>
                        <p> off</p>
                        <button class = "room-btn" > on/off</button>             
                        </div>
                        <div class ="card">
                        <h2>Lamp4</h2>
                        <p> on</p>
                        <button class = "room-btn" > on/off</button>             
                        </div>
                          <div class ="card">
                        <h2>Lamp4</h2>
                        <p> on</p>
                        <button class = "room-btn" > on/off</button>             
                        </div>
                          <div class ="card">
                        <h2>Lamp4</h2>
                        <p> on</p>
                        <button class = "room-btn" > on/off</button>             
                        </div>
                    </div>
                </main>
                <nav class ="nav-bottom grid-box">
                    <button class = "room-btn" data-room ="Devices"> Devices</button>
                    <button class = "room-btn" data-room ="history" > History</button>
                    <button class = "room-btn" data-room ="profile" > Profile</button>
                    <button class = "room-btn" data-room ="login" > Logout</button>
                </nav>
            </div>
        </div>
    </body>
</html>
