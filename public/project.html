<!doctype html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
    <script src="login.js" defer></script>
    <script src ="pages.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src = "favorites.js" defer></script>
    <script src="device_control.js"></script>
    <script src="https://kit.fontawesome.com/8d6a80a8d9.js" crossorigin="anonymous"></script>
    <!--<script src ="search.js" defer></script>-->
   
</head>

<body>
    <div class="wrapper">
        <div id="modalContainer">

            <div class="verticalContainer modalContent" id="modalContentLogin">
                <span class="closeModal">&times;</span>
                <h1>Log in</h1>
                <form id="loginForm">
                    <input type="hidden" name="type" value="login">
                    <label for="loginemail">Email</label>
                    <div class="inputContainer">
                        <input type="email" placeholder="Enter your email" id="loginemail" name="email"
                            autocomplete="on" required>
                        <span class="material-symbols-outlined">mail</span>
                    </div>
                    <label for="loginpassword">Password</label>
                    <div class="inputContainer">
                        <input type="password" placeholder="Enter your password" id="loginpassword" name="password"
                            required>
                        <span class="material-symbols-outlined">lock</span>
                    </div>
                    <label>
                        <input type="checkbox" checked="checked" name="remember" class="check">Remember me
                    </label>
                    <button type="submit" class="login-btn">Log in</button>
                    <div class="horizontalcontainer">
                        <a class="registerLink">Register new account</a>
                    </div>
                </form>
                <p id="loginError" class="errorMessage"></p>
            </div>

            <div class="verticalContainer modalContent" id="modalContentRegister">
                <span class="closeModal">&times;</span>
                <h1>Register new account</h1>
                <form id="registerForm">
                    <input type="hidden" name="type" value="register">
                    <label for="registerusername">Username</label>
                    <div class="inputContainer">
                        <input type="text" placeholder="Enter your username" id="registerusername" name="username"
                            autocomplete="on" required>
                        <span class="material-symbols-outlined">person</span>
                    </div>
                    <label for="registeremail">Email</label>
                    <div class="inputContainer">
                        <input type="email" placeholder="Enter your email" id="registeremail" name="email"
                            autocomplete="on" required>
                        <span class="material-symbols-outlined">mail</span>
                    </div>
                    <label for="registerpassword">Password</label>
                    <div class="inputContainer">
                        <input type="password" placeholder="Enter your password" id="registerpassword" name="password"
                            required>
                        <span class="material-symbols-outlined">lock</span>
                    </div>
                    <label for="confirmpassword">Confirm password</label>
                    <div class="inputContainer">
                        <input type="password" placeholder="Confirm your password" id="confirmpassword" name="confirmpassword"
                            required>
                        <span class="material-symbols-outlined">lock</span>
                    </div>
                    <button type="submit" class="login-btn">Register</button>
                    <div class="horizontalcontainer">
                        <a class="loginLink">Login</a>
                    </div>
                </form>
                <p id="registerError" class="errorMessage"></p>
            </div>

        </div>

        <div class="container">
            <header class="grid-box">
                <div class="logo">
                    <h1>Smart Home<h1>
                    <h3 id="userNameHeading"></h3>
                </div>
                <div class="header-button">
                    <div class ="nav-bottom-btn-mobil">
                        <button class="room-btn" data-page="Devices"> Devices</button>
                        <button class="room-btn" data-page="Data"> Data</button>
                        <button class="room-btn" data-page="Settings"> Settings</button>
                    </div>
                    <button class="room-btn" data-page="Alert"> Alerts</button>
            
                    <button id="showLogin" class="login-btn" data-room="login"> Login</button> 
                    <button id="showLogout" class="login-btn" data-room="logout"> Logout</button> 

                </div>
            </header>

            <nav class="scrollbar grid-box">
                <div class="button">
                    <form class="search">
                        <input type="search" placeholder="Search Room">
                        <button type="submit" class="search-btn">Search</button>
                    </form>
                    <button class="room-btn" data-page="Favorite"> Favorite</button>
                  <div id="room-buttons"></div>
                </div>
            </nav>

            <main  id="content-area"class="grid-box">
                <div class="top-side"> 
                    <h2 id="page-title"></h2>
                    <div class="search-container" id="deviceSearchContainer">
                        <input
                            id="deviceSearch"
                            type="search"
                            placeholder="Filter devices"
                        />
                    </div>
                </div>
               <div id="page-content"></div>
            </main>
            <nav class="nav-bottom grid-box">
                <button class="room-btn" data-page="Devices"> Devices</button>
                <button class="room-btn" data-page="History"> Data</button>
                <button class="room-btn" data-page="Settings"> Settings</button>
              
            </nav>
        </div>
    </div>
<script>
    setInterval(() => {
        fetch('update_db.php')
        .then(response => response.text())
        .then(data => console.log(data))
        .catch(error => console.error(error));}, (60000 * 10));
</script>
</body>

</html>
